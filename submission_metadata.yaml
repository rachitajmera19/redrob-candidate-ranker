ai_usage_summary: |
  Used Gemini 3.5 Flash via Antigravity to design, analyze, and build the candidate ranker.
  Implemented robust logical validation filters to catch honeypot candidates and optimized candidate scoring algorithms.

methodology_summary: |
  Rule-based scoring engine with custom heuristics designed specifically for the Senior AI Engineer role.
  Applies strict deterministic filters to completely eliminate honeypots (impossible career histories, date anomalies, skill-duration mismatches).
  Excludes IT consulting service-only candidates.
  Scores experience fit (5-9 years target), location preference (Noida/Pune hybrid), relevant NLP/IR/search/LLM skills (weighted by duration and endorsements), and titles.
  Multiplies score by Redrob activity/availability signals.
  Extremely fast streaming processing: completed in ~10 seconds on a single core with 0% honeypot rate.

